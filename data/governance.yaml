# Gobernanza por actor (ADR 007 secc. 6): ficha completa de las 29 fichas de
# `data/actors/*.yaml`, aplicada por el motor (`engine/permissions.py::
# authorize()`, consultada ANTES de la matriz de rol de `data/permissions.yaml`).
#
# Campos (ADR 007 secc. 6, literal):
#   model: cerebro (informativo aca; el que manda es `--brain`/`data/brains.yaml`,
#     ADR 004 secc. 7 -- gobernanza no elige el cerebro, solo lo que puede hacer).
#   autonomy: 0-5 (tabla de ADR 007 secc. 6). Default 5 (catalogo completo del
#     rol) para todo actor salvo `central_bank` (2, el mismo valor que ya tenia
#     `governance.yaml` desde ADR 003 secc. 6.4: Banco Central tecnico pero no
#     plenamente autonomo -- solo recomienda, no fija la tasa).
#   read: categorias visibles de la `Perception` (`republica.governance.
#     ALL_CATEGORIES`); una clave fuera de estas no se renderiza en el prompt
#     (`republica.governance.filter_perception`). Por default cubre TODO lo que
#     ese rol ya veia antes de ADR 007 (`engine/perception.py::build_perception`,
#     ADR 004 secc. 5) -- no filtra nada, reproduce el comportamiento previo.
#   write: tipos de `ActionType` que este actor puede *declarar/proponer/negociar*
#     (autonomy >= 1 o 2 segun el tipo, `republica.governance.required_tier`).
#   execute: tipos que requieren autonomy >= 3 (sin efecto fiscal: `SET_RATE`,
#     `STRIKE`, `PUBLISH_STORY`, `WITHHOLD_INVESTMENT`, `INVEST`) o >= 4 (con
#     efecto fiscal acotado: `GRANT_CONCESSION`, `ENACT_POLICY`), ademas de
#     figurar aca (`republica.governance.EXECUTE_TIER`).
#   human_approval_required: en `republica play`, las acciones EXECUTE de este
#     actor se difieren a un dilema Si/No para el jugador (ADR 007 secc. 6,
#     deliverable 6) en vez de autorizarse solas. Solo `central_bank` (el
#     ejemplo literal del ADR) lo trae `true` para v0.7: es el unico actor cuyo
#     `autonomy` de gobernanza default (2) ya bloquea su unica accion EXECUTE
#     (`SET_RATE`), asi que activar la aprobacion humana ahi es lo que deja
#     "ensayar" el experimento canonico (`autonomy` 2 vs. 4, ver ADR 007 secc.
#     6 in fine) sin que el Banco Central emita tasas sin supervision ni en
#     `run` (que auto-aprueba siempre, ver Notas de implementacion) ni en
#     `play` con `autonomy=4`.
#   max_authority: descripcion libre (no la interpreta el motor), documental.
#   budget: `actions_per_turn`/`tokens_per_turn`. `actions_per_turn: 3` iguala
#     al presupuesto generico del motor (`engine/permissions.py::
#     ACTION_BUDGET_PER_TURN`) a proposito: el chequeo de gobernanza solo corta
#     una accion ADICIONAL cuando es mas estricto que ese generico (< 3, ver
#     Notas de implementacion) -- con 3 en las 29 fichas, el default no resta
#     ningun comportamiento previo (test de hash dorado, ADR 007 secc. 7 punto 5).
#     `tokens_per_turn` es informativo en v0.7 (no hay backend real corriendo en
#     este entorno para gastarlos): valores inventados por rol, del mismo orden
#     que el ejemplo literal del ADR (`central_bank: 2000`).
#
# Generado desde `data/permissions.yaml` + `data/actors/*.yaml` (un actor por
# rol comparte `read`/`write`/`execute`/`max_authority`/`budget`; `autonomy`/
# `human_approval_required` distinguen solo a `central_bank`) -- ver Notas de
# implementacion de ADR 007 para el script.
biz_agro:
  model: rules
  autonomy: 5
  read:
  - economic_indicators
  - sector
  - government_announcements
  write:
  - BREAK_ALLIANCE
  - FORM_ALLIANCE
  - LOBBY_CONGRESS
  - NEGOTIATE
  - NO_ACTION
  - OPPOSE_POLICY
  - PUBLIC_STATEMENT
  - SUPPORT_POLICY
  execute:
  - INVEST
  - WITHHOLD_INVESTMENT
  human_approval_required: false
  max_authority: full_catalog
  budget:
    actions_per_turn: 3
    tokens_per_turn: 2000

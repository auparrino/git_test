# Gobernanza por actor de la epoca 2003-2015 (ADR 013 secc. 1): copia de data/governance.yaml de Aurora con ids
# remapeados a los actores de esta epoca (mismo template por ROL, ver
# scripts/build_argentina_eras.py::GOVERNANCE_BY_ROLE). Ver data/governance.yaml para
# el significado de cada campo (ADR 007 secc. 6).
biz_agro:
  model: rules
  autonomy: 5
  read:
  - economic_indicators
  - sector
  - government_announcements
  write:
  - BREAK_ALLIANCE
  - FORM_ALLIANCE
  - LOBBY_CONGRESS
  - NEGOTIATE
  - NO_ACTION
  - OPPOSE_POLICY
  - PUBLIC_STATEMENT
  - SUPPORT_POLICY
  execute:
  - INVEST
  - WITHHOLD_INVESTMENT
  human_approval_required: false
  max_authority: full_catalog
  budget:
    actions_per_turn: 3
    tokens_per_turn: 2000

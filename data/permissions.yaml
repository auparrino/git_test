# Matriz de permisos rol -> tipos de accion permitidos (ADR 003 secc. 4).
# `authorize()` (engine/permissions.py) hace el primero de sus 5 chequeos
# contra esta tabla. "todos salvo president" del ADR = todos los roles menos
# `president` para SUPPORT_POLICY/OPPOSE_POLICY; "todos" (PUBLIC_STATEMENT,
# NO_ACTION) = los 9 roles.
president:
  - PUBLIC_STATEMENT
  - PROPOSE_POLICY
  - ENACT_POLICY
  - GRANT_CONCESSION
  - NO_ACTION
  # ADR 006 secc. 2.5: solo en los ultimos 4 meses del mandato (chequeo 3
  # de `engine/permissions.py`).
  - CAMPAIGN
  - PROMISE

economy_minister:
  - SUPPORT_POLICY
  - OPPOSE_POLICY
  - NEGOTIATE
  - PUBLIC_STATEMENT
  - RECOMMEND_RATE
  - PROPOSE_POLICY
  - NO_ACTION


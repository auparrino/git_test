[project]
name = "republica-artificial"
version = "0.1.0"
description = "República Artificial — laboratorio político jugable y framework de experimentación con agentes IA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich",
    "pyyaml",
]

# ADR 007 secc. 5: extra opcional para `republica traces export --to
# langfuse` -- sin instalar, `ai/tracing.py::try_export_langfuse` cae solo a
# `traces.jsonl` (ver docstring). No es una dependencia por default: este
# entorno no tiene red hacia Langfuse.
#
# ADR 008 secc. 3: extra opcional para `republica experiment load`/`report`
# (DuckDB + notebooks de analisis). El runner (`republica experiment run`)
# NO depende de esto -- corre una simulacion y escribe JSONL con las
# dependencias base nada mas; `experiments/store.py`/`report.py` importan
# `duckdb`/`matplotlib` de forma perezosa (dentro de la funcion que los usa)
# y fallan con un mensaje en castellano si no estan instalados.
#
# ADR 009 secc. 1: extras opcionales de Fase 9. `ml` (sustituto, active
# learning, early-warning, clustering: `src/republica/ml/`) y `ui`
# (`republica ui`, Streamlit) se importan de forma perezosa, igual que
# `duckdb`/`matplotlib` arriba -- el motor y la CLI base siguen corriendo
# sin numpy/sklearn/streamlit instalados.
[project.optional-dependencies]
langfuse = ["langfuse>=2"]
analysis = ["duckdb>=1", "pandas>=2", "matplotlib>=3"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
ui = ["streamlit>=1.35"]

# ADR 010 secc. 7: extra opcional de la CPU social minima (`src/republica/core/`).
# `numpy` es la unica dependencia -- el paquete vectoriza el estado por turno
# (inventarios, necesidades, aceptabilidad) con arrays; se importa de forma
# perezosa (dentro de las funciones que lo usan) para que el motor de v1
# (`republica.engine`, `republica.world`, ...) siga importando sin numpy.
core = ["numpy>=1.26"]

# ADR 011 secc. 7 (A3): extra opcional de `republica calibrate` (CMA-ES
# sobre `src/republica/calibration/`). Se importa de forma perezosa (dentro
# de `calibration/optimizer.py::run_cma`), igual que `duckdb`/`streamlit`
# arriba -- el motor/CLI base siguen corriendo sin `cma` instalado; solo
# `republica calibrate` lo necesita.
calibration = ["cma>=3.3"]

[project.scripts]
republica = "republica.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[tool.pytest.ini_options]
markers = [
    "slow: corridas grandes (ej. 1000 semillas); no corren por default.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/republica"]
